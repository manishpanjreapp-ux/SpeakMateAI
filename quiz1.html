<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz 1 - Greetings | SpeakMate AI</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .quiz-header {
            margin-bottom: 20px;
        }

        .quiz-header h1 {
            margin-bottom: 8px;
        }

        .quiz-header p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 18px;
        }

        .info-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #94a3b8;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #facc15;
            margin-top: 4px;
        }

        .question-number {
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
            text-align: left;
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            line-height: 1.5;
            color: white;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            width: 100%;
            padding: 14px;
            margin: 0;
            border-radius: 14px;
            background: #1e293b;
            border: 2px solid transparent;
            color: white;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #334155;
            transform: translateY(-1px);
        }

        .option.correct {
            background: #166534;
            border-color: #22c55e;
        }

        .option.wrong {
            background: #991b1b;
            border-color: #ef4444;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .feedback {
            display: none;
            margin-top: 15px;
            padding: 14px;
            border-radius: 14px;
            line-height: 1.5;
            font-weight: bold;
        }

        .feedback.correct-feedback {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .feedback.wrong-feedback {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .next-btn {
            display: none;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        .result-box {
            display: none;
        }

        .result-icon {
            font-size: 65px;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 32px;
            font-weight: bold;
            color: #facc15;
            margin: 15px 0;
        }

        .result-message {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .reward-box {
            background: rgba(250, 204, 21, 0.10);
            border: 1px solid rgba(250, 204, 21, 0.25);
            border-radius: 18px;
            padding: 18px;
            margin: 20px 0;
            color: #fde68a;
        }

        .result-btn {
            margin-top: 10px;
        }

        .retry-btn {
            background: #475569;
        }

        .course-btn {
            background: #0f766e;
        }

        body {
            padding-bottom: 90px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: #111827;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #38bdf8;
            z-index: 999;
        }

        .bottom-nav a {
            color: white;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .bottom-nav a.active {
            color: #38bdf8;
            font-weight: bold;
        }

        .bottom-nav span {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- QUIZ AREA -->
        <div id="quizArea">

            <div class="quiz-header">

                <h1>📝 Quiz 1</h1>

                <p>
                    Greetings & Basic English
                </p>

            </div>


            <!-- QUIZ INFO -->
            <div class="quiz-info">

                <div class="info-box">
                    <div class="info-label">Question</div>
                    <div class="info-value">
                        <span id="questionNumber">1</span>/10
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-label">Score</div>
                    <div class="info-value">
                        ⭐ <span id="scoreDisplay">0</span>
                    </div>
                </div>

            </div>


            <!-- QUESTION -->
            <div class="question-box">

                <div class="question-number" id="questionLabel">
                    Question 1
                </div>

                <div class="question" id="questionText">
                    Loading question...
                </div>

            </div>


            <!-- OPTIONS -->
            <div class="options" id="optionsContainer">
            </div>


            <!-- FEEDBACK -->
            <div id="feedback" class="feedback">
            </div>


            <!-- NEXT -->
            <button id="nextButton" class="next-btn" onclick="nextQuestion()">
                Next Question →
            </button>

        </div>


        <!-- RESULT AREA -->
        <div id="resultBox" class="result-box">

            <div class="result-icon" id="resultIcon">
                🎉
            </div>

            <h1>Quiz Complete!</h1>

            <div class="result-score">
                <span id="finalScore">0</span>/10
            </div>

            <p class="result-message" id="resultMessage">
            </p>


            <!-- REWARD -->
            <div class="reward-box" id="rewardBox">

                🏆 <strong>Quiz Reward</strong>

                <br><br>

                ⭐ <strong>+20 XP</strong>
                <br>
                🪙 <strong>+10 Coins</strong>

                <br><br>

                <span id="rewardStatus"></span>

            </div>


            <button class="result-btn" onclick="goToLesson()">
                📖 Review Lesson
            </button>


            <button class="result-btn course-btn" onclick="goToCourse()">
                📚 Back to Course
            </button>


            <button class="result-btn retry-btn" onclick="restartQuiz()">
                🔄 Try Again
            </button>

        </div>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">

        <a href="home.html">
            <span>🏠</span>
            Home
        </a>

        <a href="course.html">
            <span>📚</span>
            Course
        </a>

        <a href="chat.html">
            <span>🤖</span>
            AI Chat
        </a>

        <a href="quiz1.html" class="active">
            <span>📝</span>
            Quiz
        </a>

        <a href="profile.html">
            <span>👤</span>
            Profile
        </a>

    </div>


    <script>

        // ====================================
        // QUIZ QUESTIONS
        // ====================================

        const questions = [

            {
                question: "What does 'Hello' mean in Hindi?",
                options: [
                    "नमस्ते",
                    "धन्यवाद",
                    "शुभ रात्रि",
                    "माफ़ कीजिए"
                ],
                answer: 0,
                explanation: "Hello का मतलब नमस्ते / हेलो होता है।"
            },

            {
                question: "What does 'Good Morning' mean?",
                options: [
                    "शुभ रात्रि",
                    "सुप्रभात",
                    "शुभ संध्या",
                    "धन्यवाद"
                ],
                answer: 1,
                explanation: "Good Morning का मतलब सुप्रभात होता है।"
            },

            {
                question: "Which sentence means 'आप कैसे हैं?'",
                options: [
                    "What is your name?",
                    "Good morning.",
                    "How are you?",
                    "Thank you."
                ],
                answer: 2,
                explanation: "How are you? का मतलब 'आप कैसे हैं?' होता है।"
            },

            {
                question: "What does 'Thank You' mean?",
                options: [
                    "धन्यवाद",
                    "कृपया",
                    "माफ़ कीजिए",
                    "कल मिलते हैं"
                ],
                answer: 0,
                explanation: "Thank You का मतलब धन्यवाद होता है।"
            },

            {
                question: "What should you say when someone helps you?",
                options: [
                    "Good Night",
                    "Thank You",
                    "Excuse Me",
                    "Hello"
                ],
                answer: 1,
                explanation: "किसी की मदद के लिए Thank You कहना polite है।"
            },

            {
                question: "What does 'Good Night' mean?",
                options: [
                    "सुप्रभात",
                    "शुभ दोपहर",
                    "शुभ रात्रि",
                    "नमस्ते"
                ],
                answer: 2,
                explanation: "Good Night का मतलब शुभ रात्रि होता है।"
            },

            {
                question: "What does 'Nice to Meet You' mean?",
                options: [
                    "आपसे मिलकर खुशी हुई",
                    "आप कहाँ रहते हैं?",
                    "मैं ठीक हूँ",
                    "फिर मिलेंगे"
                ],
                answer: 0,
                explanation: "Nice to Meet You का मतलब 'आपसे मिलकर खुशी हुई' है।"
            },

            {
                question: "Which phrase is used to politely get someone's attention?",
                options: [
                    "Good Night",
                    "Excuse Me",
                    "Thank You",
                    "You're Welcome"
                ],
                answer: 1,
                explanation: "Excuse Me का उपयोग किसी का ध्यान politely attract करने के लिए किया जाता है।"
            },

            {
                question: "Complete the sentence: 'My ___ is Manish.'",
                options: [
                    "name",
                    "morning",
                    "night",
                    "thank"
                ],
                answer: 0,
                explanation: "सही sentence है: My name is Manish."
            },

            {
                question: "What does 'See you tomorrow' mean?",
                options: [
                    "आज मिलते हैं",
                    "कल मिलते हैं",
                    "शुभ रात्रि",
                    "धन्यवाद"
                ],
                answer: 1,
                explanation: "See you tomorrow का मतलब 'कल मिलते हैं' होता है।"
            }

        ];


        // ====================================
        // VARIABLES
        // ====================================

        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        // ====================================
        // LOAD QUESTION
        // ====================================

        function loadQuestion() {

            answered = false;

            const question =
                questions[currentQuestion];


            document.getElementById("questionNumber")
                .textContent = currentQuestion + 1;

            document.getElementById("questionLabel")
                .textContent =
                "Question " + (currentQuestion + 1);

            document.getElementById("questionText")
                .textContent = question.question;

            document.getElementById("scoreDisplay")
                .textContent = score;


            const optionsContainer =
                document.getElementById("optionsContainer");

            optionsContainer.innerHTML = "";


            question.options.forEach(
                function (option, index) {

                    const button =
                        document.createElement("button");

                    button.className = "option";

                    button.textContent =
                        String.fromCharCode(65 + index) +
                        ". " +
                        option;

                    button.onclick = function () {
                        checkAnswer(index, button);
                    };

                    optionsContainer.appendChild(button);

                }
            );


            const feedback =
                document.getElementById("feedback");

            feedback.className = "feedback";

            feedback.style.display = "none";

            feedback.textContent = "";


            document.getElementById("nextButton")
                .style.display = "none";

        }


        // ====================================
        // CHECK ANSWER
        // ====================================

        function checkAnswer(selectedIndex, selectedButton) {

            if (answered) {
                return;
            }

            answered = true;


            const question =
                questions[currentQuestion];


            const allOptions =
                document.querySelectorAll(".option");


            allOptions.forEach(
                function (button, index) {

                    button.classList.add("disabled");

                    button.disabled = true;

                    if (index === question.answer) {
                        button.classList.add("correct");
                    }

                }
            );


            const feedback =
                document.getElementById("feedback");


            if (selectedIndex === question.answer) {

                score++;

                selectedButton.classList.add("correct");

                feedback.className =
                    "feedback correct-feedback";

                feedback.innerHTML =
                    "✅ Correct!<br><br>" +
                    question.explanation;

            }

            else {

                selectedButton.classList.add("wrong");

                feedback.className =
                    "feedback wrong-feedback";

                feedback.innerHTML =
                    "❌ Wrong answer.<br><br>" +
                    "Correct answer: <strong>" +
                    question.options[question.answer] +
                    "</strong><br><br>" +
                    question.explanation;

            }


            feedback.style.display = "block";

            document.getElementById("scoreDisplay")
                .textContent = score;


            const nextButton =
                document.getElementById("nextButton");

            nextButton.style.display = "block";


            if (currentQuestion === questions.length - 1) {

                nextButton.textContent =
                    "🏆 See Result";

            }
            else {

                nextButton.textContent =
                    "Next Question →";

            }

        }


        // ====================================
        // NEXT QUESTION
        // ====================================

        function nextQuestion() {

            if (!answered) {
                return;
            }


            currentQuestion++;


            if (currentQuestion >= questions.length) {

                finishQuiz();

                return;

            }


            loadQuestion();

        }


        // ====================================
        // FINISH QUIZ
        // ====================================

        function finishQuiz() {

            document.getElementById("quizArea")
                .style.display = "none";

            document.getElementById("resultBox")
                .style.display = "block";


            document.getElementById("finalScore")
                .textContent = score;


            const percentage =
                (score / questions.length) * 100;


            const icon =
                document.getElementById("resultIcon");

            const message =
                document.getElementById("resultMessage");


            if (percentage >= 80) {

                icon.textContent = "🏆";

                message.innerHTML =
                    "Excellent! 🔥<br>" +
                    "You did a great job in this quiz. " +
                    "Keep practicing your English.";

            }

            else if (percentage >= 50) {

                icon.textContent = "🎉";

                message.innerHTML =
                    "Good job! 👍<br>" +
                    "You understand the basics. " +
                    "Review the lesson and try again to improve.";

            }

            else {

                icon.textContent = "💪";

                message.innerHTML =
                    "Don't give up!<br>" +
                    "Review Lesson 1 and practice the sentences again. " +
                    "You can do better next time.";

            }


            // ====================================
            // GIVE REWARD ONLY ONCE
            // ====================================

            const alreadyCompleted =
                localStorage.getItem("quiz1Completed") === "true";


            const rewardStatus =
                document.getElementById("rewardStatus");


            if (!alreadyCompleted && score >= 5) {

                let xp =
                    Number(localStorage.getItem("xp") || 0);

                let coins =
                    Number(localStorage.getItem("coins") || 0);


                xp += 20;
                coins += 10;


                localStorage.setItem("xp", xp);
                localStorage.setItem("coins", coins);

                localStorage.setItem(
                    "quiz1Completed",
                    "true"
                );


                rewardStatus.innerHTML =
                    "🎁 Reward added to your account!";

            }

            else if (alreadyCompleted) {

                rewardStatus.innerHTML =
                    "✅ You already received this quiz reward.";

            }

            else {

                rewardStatus.innerHTML =
                    "📚 Score 5/10 or higher to earn the reward.";

            }

        }


        // ====================================
        // RETRY QUIZ
        // ====================================

        function restartQuiz() {

            currentQuestion = 0;
            score = 0;

            document.getElementById("quizArea")
                .style.display = "block";

            document.getElementById("resultBox")
                .style.display = "none";

            loadQuestion();

        }


        // ====================================
        // NAVIGATION
        // ====================================

        function goToLesson() {

            window.location.href =
                "lesson1.html";

        }


        function goToCourse() {

            window.location.href =
                "course.html";

        }


        // ====================================
        // START QUIZ
        // ====================================

        loadQuestion();

    </script>

</body>

</html>
