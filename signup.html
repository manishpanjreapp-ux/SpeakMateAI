<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - SpeakMate AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚀 Create Account</h1>

        <p>Join SpeakMate AI and start learning English.</p>

        <input type="text" id="name" placeholder="Enter Your Name" autocomplete="name">

        <br><br>

        <input type="email" id="email" placeholder="Enter Email" autocomplete="email">

        <br><br>

        <input type="password" id="password" placeholder="Create Password" autocomplete="new-password">

        <br><br>

        <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password">

        <br><br>

        <button onclick="signup()">
            Create Account
        </button>

        <br><br>

        <p>
            Already have an account?
        </p>

        <button onclick="window.location.href='Login.html'">
            🔐 Login
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
