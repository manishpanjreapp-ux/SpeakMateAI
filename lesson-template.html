<body>

    <script>

        const lessonNumber = 4; // Isko har lesson me badalna

        function completeLesson() {

            let xp = Number(localStorage.getItem("xp") || 0);
            let coins = Number(localStorage.getItem("coins") || 0);

            xp += 10;
            coins += 5;

            localStorage.setItem("xp", xp);
            localStorage.setItem("coins", coins);

            // Next Lesson Unlock
            localStorage.setItem("lesson" + (lessonNumber + 1) + "Unlocked", "true");

            alert("🎉 Lesson Completed!\n\n+10 XP\n+5 Coins");

        }

    </script>

</body>
